<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mieszkania do wynajęcia</title>
<meta name="description" content="Aktualne ogłoszenia mieszkań na wynajem z Otodom, Morizon, OLX i Nieruchomosci-online.">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --fg: #1d1f23; --muted: #62666d; --line: #e3e3de;
    --star: #b7791f; --accent: #1a5fd0; --accent-fg: #ffffff; --badge-bg: #d9f2e0; --badge-fg: #14532d; --warn: #9a5b00;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1c1f25; --fg: #e8e9ec; --muted: #9a9fa8; --line: #2d3139;
      --star: #f5c451; --accent: #7aa8ff; --accent-fg: #0b1220; --badge-bg: #1d4a2c; --badge-fg: #b7efc9; --warn: #f0b24a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }
  .sub .warn { color: var(--warn); font-weight: 600; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #status { padding: 40px 0; text-align: center; color: var(--muted); }
  button, input, select {
    font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  form#filters {
    display: grid; gap: 10px; align-items: end; margin-bottom: 10px;
    grid-template-columns: 1.5fr 1fr 1.3fr 1fr 1.1fr 1fr 1.3fr auto auto;
  }
  form#filters label, form#filters .field { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); min-width: 0; }
  form#filters input:not([type=checkbox]), form#filters select { width: 100%; }
  .multi { position: relative; }
  .multi details { position: static; }
  .multi summary {
    list-style: none; cursor: pointer; background: var(--surface); color: var(--fg); font-size: 1rem;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 28px 7px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative;
  }
  .multi summary::-webkit-details-marker { display: none; }
  .multi summary::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .multi .panel {
    position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; min-width: 100%; width: max-content; max-width: 90vw;
    max-height: 300px; overflow: auto; padding: 6px; background: var(--surface); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  }
  .opt { flex-direction: row !important; align-items: center; gap: 8px !important; padding: 5px 6px; border-radius: 6px; font-size: .92rem !important; color: var(--fg) !important; cursor: pointer; }
  .opt:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .opt input { width: auto; }
  .opt .cnt { margin-left: auto; padding-left: 14px; color: var(--muted); font-size: .8rem; }
  .checks { display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px; max-width: 210px; }
  label.check { flex-direction: row !important; align-items: center; gap: 6px !important; color: var(--fg) !important; font-size: .9rem !important; }
  label.check small { display: block; color: var(--muted); font-size: .75rem; line-height: 1.2; }
  label.check input { width: auto; }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin: 6px 0 8px; color: var(--muted); font-size: .9rem; }
  .sort-mobile { display: none; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  thead th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; font-size: .8rem; border-bottom: 1px solid var(--line); padding: 0; }
  thead th button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 10px 10px; cursor: pointer; color: var(--muted); }
  thead th button:hover { color: var(--fg); }
  thead th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  th[aria-sort="ascending"] button::after { content: " ▲"; font-size: .7em; }
  th[aria-sort="descending"] button::after { content: " ▼"; font-size: .7em; }
  th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--fg); }
  th.num, td.num { text-align: right; }
  th.num button { text-align: right; }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.title { min-width: 240px; overflow-wrap: anywhere; } /* long slash-joined words must wrap, not widen the table */
  td.title a { text-decoration: none; font-weight: 500; }
  td.title a:hover { text-decoration: underline; }
  td.price { font-weight: 600; white-space: nowrap; }
  td.num, td.added { white-space: nowrap; }
  td.ppm, td.added, td.district { color: var(--muted); }
  .chip { display: inline-block; margin: 0 4px 3px 0; padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; white-space: nowrap; color: var(--accent); text-decoration: none; }
  a.chip:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: var(--accent); }
  .badge { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 999px; font-size: .68rem; font-weight: 700; letter-spacing: .03em; background: var(--badge-bg); color: var(--badge-fg); vertical-align: 1px; }
  td.actions { white-space: nowrap; width: 1%; padding-right: 0; }
  .act { all: unset; box-sizing: border-box; cursor: pointer; min-width: 30px; padding: 4px 6px; text-align: center; font-size: 1.15rem; line-height: 1; border-radius: 6px; color: var(--muted); }
  .act:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--fg); }
  .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .act.fav[aria-pressed="true"] { color: var(--star); }
  tr.is-hidden td:not(.actions), tr.is-gone td:not(.actions) { opacity: .55; }
  tr.is-gone td.added { font-style: italic; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 12px;
    max-width: calc(100vw - 24px); padding: 10px 14px; background: var(--fg); color: var(--bg); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .3); }
  #toast[hidden] { display: none; }
  #toast button { all: unset; cursor: pointer; font-weight: 700; color: var(--bg); text-decoration: underline; padding: 6px 8px; }
  #toast button:focus-visible { outline: 2px solid var(--bg); outline-offset: 2px; }
  #empty { text-align: center; color: var(--muted); padding: 32px 0; }

  @media (max-width: 860px) {
    form#filters { grid-template-columns: 1fr 1fr 1fr; }
    form#filters label.search { grid-column: 1 / -1; }
  }
  @media (max-width: 700px) {
    main { padding: 14px 12px 40px; }
    form#filters { grid-template-columns: 1fr 1fr; }
    .sort-mobile { display: flex; align-items: center; gap: 6px; }
    .multi .panel { left: auto; right: 0; max-width: calc(100vw - 24px); } /* the district box is in the right column */
    thead { display: none; }
    table, tbody { display: block; background: none; border: 0; }
    /* card: title / price · area · rooms · zł/m² / district · portal · added */
    tbody tr {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 14px; margin-bottom: 10px; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    }
    tbody tr::after { content: ""; flex: 0 0 100%; height: 0; order: 5; } /* forced line break */
    tbody tr:hover { background: var(--surface); }
    tbody td { display: block; padding: 0; border: 0; text-align: left; }
    tbody tr { position: relative; }
    td.actions { position: absolute; top: 2px; right: 4px; width: auto; display: flex; gap: 10px; }
    .act { min-width: 42px; min-height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    td.title { flex: 0 0 100%; order: 0; margin-bottom: 4px; font-size: 1rem; padding-right: 108px; }
    td.price { order: 1; } td.area { order: 2; } td.rooms { order: 3; } td.ppm { order: 4; }
    td.district { order: 6; } td.site { order: 7; } td.added { order: 8; }
    td.district, td.site, td.added { font-size: .85rem; }
    td.rooms::after { content: " pok."; }
  }
</style>
</head>
<body>
<main>
  <h1>Mieszkania do wynajęcia<span id="city"></span></h1>
  <p class="sub"><span id="updated"></span></p>

  <div id="status">
    <p id="status-text">Ładowanie…</p>
    <button id="retry" class="primary" type="button" hidden>Spróbuj ponownie</button>
    <noscript><p>Ta strona wymaga włączonego JavaScriptu.</p></noscript>
  </div>

  <div id="app" hidden>
    <form id="filters" autocomplete="off" onsubmit="return false">
      <label class="search">Szukaj
        <input id="q" type="search" placeholder="Tytuł lub dzielnica">
      </label>
      <label>Portal
        <select id="site"><option value="">Wszystkie</option></select>
      </label>
      <div class="field multi">
        <span id="districtLabel">Dzielnica</span>
        <details id="district">
          <summary id="districtSummary" aria-labelledby="districtLabel districtSummary">Wszystkie</summary>
          <div id="districtPanel" class="panel" role="group" aria-labelledby="districtLabel"></div>
        </details>
      </div>
      <label>Cena do (zł)
        <input id="maxPrice" type="number" inputmode="numeric" min="0" step="100">
      </label>
      <label>Powierzchnia od (m²)
        <input id="minArea" type="number" inputmode="numeric" min="0" step="5">
      </label>
      <label>Pokoje od
        <select id="minRooms">
          <option value="">Dowolnie</option><option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
      </label>
      <label>Pokaż
        <select id="show">
          <option value="current">Aktualne</option>
          <option value="fav">Ulubione</option>
          <option value="hidden">Ukryte</option>
        </select>
      </label>
      <div class="checks">
        <label class="check"><input id="onlyNew" type="checkbox"><span>Tylko nowe <small id="onlyNewHint">(24 h)</small></span></label>
        <label class="check"><input id="merge" type="checkbox" checked> Łącz duplikaty</label>
      </div>
      <button id="clearFilters" type="button">Wyczyść filtry</button>
    </form>

    <div class="bar">
      <span id="count" aria-live="polite"></span>
      <label class="sort-mobile">Sortuj
        <select id="sort">
          <option value="newest">Najnowsze</option>
          <option value="price-asc">Cena: rosnąco</option>
          <option value="price-desc">Cena: malejąco</option>
          <option value="area-desc">Powierzchnia: malejąco</option>
          <option value="ppm-asc">zł/m²: rosnąco</option>
          <option value="custom" hidden>Własne</option>
        </select>
      </label>
    </div>

    <table>
      <caption class="sr-only">Ogłoszenia mieszkań na wynajem</caption>
      <thead>
        <tr>
          <th scope="col" class="actions"><span class="sr-only">Akcje</span></th>
          <th scope="col" data-key="title"><button type="button">Tytuł</button></th>
          <th scope="col" data-key="price" class="num"><button type="button">Cena</button></th>
          <th scope="col" data-key="area" class="num"><button type="button">Pow.</button></th>
          <th scope="col" data-key="ppm" class="num"><button type="button">zł/m²</button></th>
          <th scope="col" data-key="rooms" class="num"><button type="button">Pokoje</button></th>
          <th scope="col" data-key="district"><button type="button">Dzielnica</button></th>
          <th scope="col" data-key="site"><button type="button">Portal</button></th>
          <th scope="col" data-key="firstSeen"><button type="button">Dodano</button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" hidden>Brak ogłoszeń spełniających kryteria.</p>
  </div>
</main>
<div id="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo" type="button">Cofnij</button></div>
<script src="app.js"></script>
</body>
</html>
